name: Firmware checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  control-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test actual firmware control component on host
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g -Ifirmware/components/control/include firmware/components/control/control.c tests/control_tests.c -lm -o /tmp/control-tests
          /tmp/control-tests
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g -Ifirmware/components/relay/include firmware/components/relay/relay.c tests/relay_tests.c -o /tmp/relay-tests
          /tmp/relay-tests
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g -Ifirmware/components/relay_control/include firmware/components/relay_control/relay_mapping.c tests/relay_mapping_tests.c -o /tmp/relay-mapping-tests
          /tmp/relay-mapping-tests
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g -Ifirmware/components/control/include -Ifirmware/components/test_session/include firmware/components/control/control.c firmware/components/test_session/test_session.c tests/session_tests.c -lm -o /tmp/session-tests
          /tmp/session-tests
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g -Ifirmware/components/motion/include firmware/components/motion/motion.c firmware/components/motion/motion_memory.c tests/motion_tests.c -lm -o /tmp/motion-tests
          /tmp/motion-tests
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g -Ifirmware/components/control/include -Ifirmware/components/test_session/include -Ifirmware/components/motion/include -Ifirmware/components/control_service/include firmware/components/control/control.c firmware/components/test_session/test_session.c firmware/components/motion/motion.c firmware/components/motion/motion_memory.c firmware/components/control_service/control_service.c tests/service_tests.c -lm -o /tmp/service-tests
          /tmp/service-tests
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g -Ifirmware/components/control/include -Ifirmware/components/test_session/include -Ifirmware/components/motion/include -Ifirmware/components/control_service/include firmware/components/control/control.c firmware/components/test_session/test_session.c firmware/components/motion/motion.c firmware/components/motion/motion_memory.c firmware/components/control_service/control_service.c tests/contract_tests.c -lm -o /tmp/contract-tests
          /tmp/contract-tests
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g -Ifirmware/components/ble_console/include firmware/components/ble_console/ble_frame.c tests/ble_frame_tests.c -o /tmp/ble-frame-tests
          /tmp/ble-frame-tests
          python3 tests/ble_client_tests.py
  browser-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tests/workout_catalog.test.cjs
      - run: node tests/web_console.test.cjs
  esp32-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    strategy:
      matrix:
        project: [firmware, firmware/test_app]
        target: [esp32, esp32s3]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.target }} firmware
        shell: bash
        working-directory: ${{ matrix.project }}
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target ${{ matrix.target }}
          idf.py build
  ble-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    strategy:
      matrix:
        target: [esp32, esp32s3]
    steps:
      - uses: actions/checkout@v4
      - name: Build opt-in BLE adapter
        shell: bash
        working-directory: firmware
        run: |
          . /opt/esp/idf/export.sh
          idf.py -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;ble.defaults" set-target ${{ matrix.target }}
          idf.py build
  mobile-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:client
      - run: pnpm --filter @nordic/mobile test
      - run: pnpm check:mobile
